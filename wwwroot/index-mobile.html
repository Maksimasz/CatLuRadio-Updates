<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CatLu Radio</title>
  <link rel="stylesheet" href="styles.css">
  <!-- HLS.js для поддержки HLS потоков (m3u8) - локальная версия -->
  <script src="../assets/hls.min.js"></script>
  <style>
    /* Адаптация для мобильных устройств, планшетов и Android TV */
    @media (max-width: 768px) {
      .header h1 { font-size: 18px; }
      .controls { gap: 8px; }
      .btn { padding: 8px 12px; font-size: 14px; }
    }
    
    @media (min-width: 769px) and (max-width: 1024px) {
      /* Планшет */
      .header h1 { font-size: 20px; }
    }
    
    /* Android TV - поддержка навигации с пульта */
    @media (prefers-color-scheme: no-preference) {
      /* Стили для TV */
      .station-item:focus,
      .tab-btn:focus,
      .btn:focus {
        outline: 3px solid #6200ee;
        outline-offset: 2px;
      }
    }
    
    /* Улучшенная поддержка фокуса для пульта */
    .station-item,
    .tab-btn,
    .btn {
      -webkit-tap-highlight-color: transparent;
    }
    
    .station-item:focus-visible,
    .tab-btn:focus-visible,
    .btn:focus-visible {
      outline: 3px solid #6200ee;
      outline-offset: 2px;
      background-color: rgba(98, 0, 238, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <h1>📻 CatLu Radio</h1>
        <div id="clock" class="clock" style="font-size: 14px; font-weight: 500; opacity: 0.9;"></div>
      </div>
      <div class="controls">
        <button id="playPauseBtn" class="btn btn-primary" title="Воспроизвести/Пауза">
          <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: inline-block;">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pauseIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
          </svg>
        </button>
        <button id="stopBtn" class="btn btn-secondary" title="Остановить">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="1"/>
          </svg>
        </button>
        <div class="volume-control">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <input type="range" id="volumeSlider" min="0" max="100" value="50">
          <span id="volumeValue">50%</span>
        </div>
        <button id="exitBtn" class="btn btn-exit" title="Выход из приложения">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="stations">Станции</button>
      <button class="tab-btn" data-tab="favorites">Избранное</button>
      <button class="tab-btn" data-tab="history">История</button>
      <button class="tab-btn" data-tab="equalizer">Эквалайзер</button>
    </div>

    <div class="tab-content active" id="stations-tab">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск станций...">
        <select id="filterSelect">
          <option value="all">Все страны</option>
          <option value="RU">Россия</option>
          <option value="UK">Великобритания</option>
          <option value="US">США</option>
          <option value="FR">Франция</option>
          <option value="DE">Германия</option>
          <option value="IT">Италия</option>
          <option value="CH">Швейцария</option>
          <option value="IL">Израиль</option>
          <option value="LT">Литва</option>
        </select>
      </div>
      <div id="stationsList" class="stations-list"></div>
    </div>

    <div class="tab-content" id="favorites-tab">
      <div id="favoritesList" class="stations-list"></div>
      <p class="empty-message" id="favoritesEmpty" style="display: none;">
        Нет избранных станций. Добавьте станции в избранное из списка станций.
      </p>
    </div>

    <div class="tab-content" id="history-tab">
      <div class="history-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3>История прослушанных станций</h3>
        <button id="clearHistoryBtn" class="btn btn-secondary">Очистить историю</button>
      </div>
      <div id="historyList" class="stations-list"></div>
      <p class="empty-message" id="historyEmpty" style="display: none;">
        История пуста. Начните прослушивать станции, и они появятся здесь.
      </p>
    </div>

    <div class="tab-content" id="equalizer-tab">
      <div class="equalizer-container">
        <div class="equalizer-header">
          <h3>Эквалайзер</h3>
          <div class="equalizer-presets">
            <label for="eqPresetSelect">Предустановка:</label>
            <select id="eqPresetSelect">
              <option value="normal">Обычный</option>
              <option value="pop">Поп</option>
              <option value="rock">Рок</option>
              <option value="jazz">Джаз</option>
              <option value="classic">Классика</option>
              <option value="bass">Басы</option>
              <option value="treble">Высокие</option>
              <option value="vocal">Вокал</option>
            </select>
            <button id="eqResetBtn" class="btn btn-secondary">Сброс</button>
          </div>
        </div>
        <div class="equalizer-bands" id="equalizerBands">
          <!-- Полосы эквалайзера будут добавлены динамически -->
        </div>
        <div class="equalizer-info" id="equalizerInfo">
          <p>Перетащите ползунки для настройки частот. Изменения применяются автоматически.</p>
        </div>
        <div id="equalizerDebug" style="display: none; padding: 12px; margin-top: 16px; background: rgba(255, 0, 0, 0.1); border: 1px solid rgba(255, 0, 0, 0.3); border-radius: 4px; color: red; font-size: 12px;"></div>
      </div>
    </div>

    <div class="now-playing" id="nowPlaying">
      <div class="now-playing-info">
        <span class="now-playing-label">Сейчас играет:</span>
        <div class="now-playing-details">
          <span class="now-playing-station" id="nowPlayingStation">—</span>
        </div>
        <div id="clockBottom" class="clock" style="font-size: 12px; opacity: 0.7; margin-left: auto; padding-left: 12px;"></div>
      </div>
    </div>
  </div>

  <script>
    // Проверка загрузки stations.js
    console.log('=== Загрузка stations.js ===');
    const stationsScript = document.createElement('script');
    stationsScript.src = 'stations.js';
    stationsScript.onload = function() {
      console.log('✅ stations.js загружен успешно');
      if (window.getDefaultStations) {
        console.log('✅ window.getDefaultStations доступна');
        const testStations = window.getDefaultStations();
        console.log('✅ Тест getDefaultStations():', testStations ? testStations.length : 0, 'станций');
      } else {
        console.error('❌ window.getDefaultStations НЕ доступна после загрузки stations.js!');
      }
    };
    stationsScript.onerror = function() {
      console.error('❌ ОШИБКА загрузки stations.js! Файл не найден или недоступен.');
      console.error('Проверьте, что файл stations.js существует в assets/public/');
    };
    document.head.appendChild(stationsScript);
  </script>
  <script src="api-adapter.js"></script>
  <!-- Модули -->
  <script src="modules/CountryNames.js"></script>
  <script src="modules/TranslationManager.js"></script>
  <script src="modules/ThemeManager.js"></script>
  <script src="modules/StationSorter.js"></script>
  <script src="modules/Equalizer.js"></script>
  <!-- Мобильная версия: отключение ненужных функций -->
  <script src="mobile-disable.js"></script>
  <!-- Основной скрипт для мобильной версии -->
  <script src="renderer-mobile.js"></script>
  <!-- Мобильная версия: инициализация Capacitor -->
  <script type="module" src="mobile-init.js"></script>
  <!-- Поддержка медиа-кнопок пульта для Android TV и мобильных устройств -->
  <script>
    // Поддержка медиа-кнопок для мобильных устройств, планшетов и Android TV
    (function() {
      'use strict';
      
      // Определяем тип устройства
      const isTV = window.matchMedia('(pointer: coarse) and (hover: none)').matches || 
                   navigator.userAgent.includes('TV') ||
                   navigator.userAgent.includes('Android TV');
      
      const isMobile = /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent);
      const isCapacitor = typeof window !== 'undefined' && window.Capacitor;
      
      // Обработка медиа-кнопок пульта и клавиатуры
      document.addEventListener('keydown', (e) => {
        // MediaPlayPause (пробел или медиа-кнопка пульта)
        if (e.key === ' ' || e.key === 'MediaPlayPause' || e.code === 'MediaPlayPause') {
          e.preventDefault();
          const playPauseBtn = document.getElementById('playPauseBtn');
          if (playPauseBtn) {
            playPauseBtn.click();
            playPauseBtn.focus(); // Для TV
          }
        }
        
        // MediaStop
        if (e.key === 'MediaStop' || e.code === 'MediaStop') {
          e.preventDefault();
          const stopBtn = document.getElementById('stopBtn');
          if (stopBtn) {
            stopBtn.click();
            stopBtn.focus();
          }
        }
        
        // Стрелки для навигации на TV
        if (isTV) {
          const focusedElement = document.activeElement;
          const focusableElements = Array.from(document.querySelectorAll(
            '.station-item, .tab-btn, .btn, #searchInput, #filterSelect'
          )).filter(el => !el.disabled && el.offsetParent !== null);
          
          let currentIndex = focusableElements.indexOf(focusedElement);
          
          if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
            e.preventDefault();
            currentIndex = (currentIndex + 1) % focusableElements.length;
            focusableElements[currentIndex]?.focus();
          } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
            e.preventDefault();
            currentIndex = currentIndex <= 0 ? focusableElements.length - 1 : currentIndex - 1;
            focusableElements[currentIndex]?.focus();
          } else if (e.key === 'Enter' || e.key === ' ') {
            // Enter или пробел для активации элемента
            if (focusedElement && (focusedElement.classList.contains('station-item') || 
                focusedElement.classList.contains('tab-btn') || 
                focusedElement.classList.contains('btn'))) {
              e.preventDefault();
              focusedElement.click();
            }
          }
        }
      });
      
      // Улучшенная поддержка навигации для TV при загрузке
      if (isTV) {
        document.addEventListener('DOMContentLoaded', () => {
          // Установить фокус на первый элемент при загрузке
          setTimeout(() => {
            const firstFocusable = document.querySelector('.tab-btn, .station-item, .btn');
            if (firstFocusable) {
              firstFocusable.focus();
            }
          }, 500);
        });
      }
      
      console.log('Медиа-кнопки инициализированы. Устройство:', {
        isTV,
        isMobile,
        isCapacitor,
        userAgent: navigator.userAgent
      });
    })();
  </script>
</body>
</html>
